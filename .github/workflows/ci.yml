name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Run ESLint
        run: yarn lint

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Run tests
        run: yarn test
        
      - name: Generate code coverage
        run: yarn coverage
        
      - name: Upload coverage reports (PR)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        with:
          name: coverage-reports-pr-${{ github.event.number }}
          path: |
            coverage/
            .nyc_output/
          retention-days: 7
          
      - name: Upload coverage reports (Main)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        with:
          name: coverage-reports-main
          path: |
            coverage/
            .nyc_output/
          retention-days: 30

  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: PR Quality Check
        run: |
          echo "✅ All quality checks passed!"
          echo "📊 Linting: Passed"
          echo "🧪 Tests: Passed" 
          echo "📈 Coverage: Generated"
          echo ""
          echo "🎉 This PR is ready for review and merge!"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile --production=false
        
      - name: Run final tests before deployment
        run: yarn test
        
      - name: Deployment notification start
        run: |
          echo "🚀 Starting deployment to production..."
          echo "📦 Application: ret-raksmey-lab1"
          echo "🔗 Repository: ${{ github.repository }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          
      - name: Deploy to Render
        run: |
          echo "🌐 Deploying to Render..."
          echo "✅ render.yaml configuration detected"
          echo "🔄 Render will automatically deploy from this push"
          echo "📡 Deployment URL will be available at: https://ret-raksmey-lab1.onrender.com"
          echo ""
          echo "📋 Deployment steps:"
          echo "1. Render detects push to main branch"
          echo "2. Render builds: yarn install --frozen-lockfile"
          echo "3. Render starts: yarn start"
          echo "4. Health check: GET /"
          echo "5. Service goes live"
          
      - name: Deployment notification success
        run: |
          echo "🎉 Deployment initiated successfully!"
          echo "⏱️  Build time: ~2-3 minutes"
          echo "🔍 Monitor deployment: https://dashboard.render.com"
          echo "🌟 Application will be live at: https://ret-raksmey-lab1.onrender.com"