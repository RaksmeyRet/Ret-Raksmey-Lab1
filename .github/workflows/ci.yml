name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Run ESLint
        run: yarn lint

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Run tests
        run: yarn test
        
      - name: Generate code coverage
        run: yarn coverage
        
      - name: Upload coverage reports (PR)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        with:
          name: coverage-reports-pr-${{ github.event.number }}
          path: |
            coverage/
            .nyc_output/
          retention-days: 7
          
      - name: Upload coverage reports (Main)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        with:
          name: coverage-reports-main
          path: |
            coverage/
            .nyc_output/
          retention-days: 30

  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: PR Quality Check
        run: |
          echo "✅ All quality checks passed!"
          echo "📊 Linting: Passed"
          echo "🧪 Tests: Passed" 
          echo "📈 Coverage: Generated"
          echo ""
          echo "🎉 This PR is ready for review and merge!"